server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json text/markdown;

    # Always revalidate so edits to the site or content show up on reload.
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ =404;
    }

    # Folder listings as JSON: the site reads one folder at a time as you open it.
    location /content/ {
        autoindex on;
        autoindex_format json;

        location ~* \.md$ {
            default_type text/markdown;
        }
    }
}
